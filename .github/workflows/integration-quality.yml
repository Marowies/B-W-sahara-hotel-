name: Integration quality (isolated)
on:
  push:
    branches: [integration/all-project-seo-2026-10-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-stability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BW-Sahara-Sky-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/consent.mjs
      - run: node tests/release-update.mjs
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_DATABASE: hotel_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: BW-Sahara-Sky-Hotel/public_html
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      TRACKING_MODE: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, zip, pdo_sqlite, pdo_mysql, mbstring, intl, bcmath, dom, xml, fileinfo
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer validate --no-check-publish
      - run: composer install --prefer-dist --no-progress --no-scripts --no-plugins --no-autoloader
      - name: Generate test autoload without an optimized dependency classmap
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true); $p["config"]["optimize-autoloader"]=false; file_put_contents("composer.test.json",json_encode($p));'
          COMPOSER=composer.test.json composer dump-autoload --no-scripts --no-plugins
      - run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
      - run: php scripts/check-php-syntax.php
      - run: php tests/Seo/run.php
      - run: php tests/CanonicalHost/run.php
      - run: php tests/Security/run.php
      - name: Disposable MySQL inventory, calendar and payment concurrency
        env:
          HOTEL_TEST_RESULT_PATH: /tmp/hotel-integration-results.json
        run: |
          php -r 'file_put_contents("/tmp/hotel-test-db.php", "<?php return " . var_export(["driver"=>"mysql", "host"=>"127.0.0.1", "port"=>3306, "database"=>"hotel_test_ci", "username"=>"root", "password"=>"integration-test-only", "charset"=>"utf8mb4", "collation"=>"utf8mb4_unicode_ci", "prefix"=>""], true) . ";");'
          php -d allow_url_fopen=0 -d disable_functions=curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client tests/Integration/run.php vendor/autoload.php /tmp/hotel-test-db.php
      - run: node --test tests/Tracking/managed.test.cjs
      - run: php -d allow_url_fopen=0 -d disable_functions=curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client vendor/bin/phpunit --configuration phpunit.xml
      - run: node --test tests/deployment-config.mjs
        working-directory: BW-Sahara-Sky-Frontend
