name: SEO and Laravel quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [seo/clean-implementation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    defaults:
      run:
        working-directory: public_html
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      TRACKING_MODE: 'off'
      GA4_MEASUREMENT_ID: ''
      GTM_CONTAINER_ID: ''
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, zip, pdo_sqlite, mbstring, intl, bcmath, dom, xml, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish
      - name: Install locked dependencies without app scripts or Composer plugins
        run: composer install --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Prepare disposable test directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
      - name: PHP syntax
        run: php scripts/check-php-syntax.php
      - name: SEO regressions
        run: php tests/Seo/run.php
      - name: Consent and event regressions without Google requests
        run: node --test tests/Tracking/managed.test.cjs
      - name: PHPUnit with isolated SQLite and no outbound PHP transport
        run: php -d allow_url_fopen=0 -d disable_functions=curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client vendor/bin/phpunit --configuration phpunit.xml --log-junit storage/phpunit-results.xml
      - name: Upload PHPUnit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.php }}
          path: public_html/storage/phpunit-results.xml
          if-no-files-found: ignore
