</style>

<script>
    (function() {
        if (window.bbPasswordToggleInitialized) {
            return;
        }

        window.bbPasswordToggleInitialized = true;

        function initPasswordToggles() {
            document.querySelectorAll('[data-bb-toggle-password]').forEach(function(button) {
                if (button.dataset.initialized === 'true') {
                    return;
                }

                button.dataset.initialized = 'true';

                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const inputGroup = this.closest('.input-group');
                    const passwordField = inputGroup ? inputGroup.querySelector(
                        '[data-bb-password]') : null;

                    if (!passwordField) {
                        console.warn('Password field not found for toggle button');
                        return;
                    }

                    if (passwordField.getAttribute('type') === 'password') {
                        passwordField.setAttribute('type', 'text');
                        this.innerHTML = `<svg class="icon svg-icon-ti-ti-eye-off"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"

  stroke-linejoin="round"
>

  <path d="M3 3l18 18" />
</svg>`;
                    } else {
                        passwordField.setAttribute('type', 'password');
                        this.innerHTML = `<svg class="icon svg-icon-ti-ti-eye"
  xmlns="http://www.w3.org/2000/svg"
  width="24"

  viewBox="0 0 24 24"

>

</svg>`;
                    }
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPasswordToggles);
        } else {
            initPasswordToggles();
        }
    })();
</script>

                    <script>
    jQuery(document).ready(function() {
        'use strict';
        $("#botble-a-c-l-forms-auth-login-form").each(function() {
            $(this).validate({
                errorElement: 'div',
                errorClass: 'invalid-feedback',

                errorPlacement: function(error, element) {
                    if (element.closest('[data-bb-toggle="tree-checkboxes"]').length) {
                        error.insertAfter(element.closest(
                            '[data-bb-toggle="tree-checkboxes"]'));
                    } else if (element.parent('.input-group').length || element.prop(
                        'type') === 'checkbox' || element.prop('type') === 'radio') {
                        error.insertAfter(element.parent());
                    } else if ($(element).data('select2')) {
                        error.insertAfter(element.next('span'));
                    } else {
                        error.insertAfter(element);
                    }
                },

                highlight: function(element) {
                    $(element).closest('.form-control').removeClass('is-valid').addClass(
                        'is-invalid');
                },

                
                unhighlight: function(element) {
                    $(element).closest('.form-control').removeClass('is-invalid').addClass(
                        'is-valid');
                },

                success: function(element) {
                    $(element).closest('.form-control').removeClass('is-invalid').addClass(
                        'is-valid');
                },

                focusInvalid: false,
                
                rules: JSON.parse('{\u0022username\u0022:{\u0022laravelValidation\u0022:[[\u0022Required\u0022,[],\u0022The username field is required.\u0022,true],[\u0022String\u0022,[],\u0022The username must be a string.\u0022,false],[\u0022Min\u0022,[\u00223\u0022],\u0022The username must be at least 3 characters.\u0022,false],[\u0022Max\u0022,[\u0022120\u0022],\u0022The username must not be greater than 120 characters.\u0022,false]]},\u0022password\u0022:{\u0022laravelValidation\u0022:[[\u0022Required\u0022,[],\u0022The password field is required.\u0022,true],[\u0022String\u0022,[],\u0022The password must be a string.\u0022,false],[\u0022Min\u0022,[\u00226\u0022],\u0022The password must be at least 6 characters.\u0022,false],[\u0022Max\u0022,[\u0022120\u0022],\u0022The password must not be greater than 120 characters.\u0022,false]]}}')
